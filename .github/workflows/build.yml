name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip RbxLauncher.zip -d proj
      - run: if [ -f custom.ttf ]; then cp custom.ttf proj/app/src/main/assets/fonts/custom.ttf; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with: { name: launcher-apk, path: proj/app/build/outputs/apk/debug/app-debug.apk }
